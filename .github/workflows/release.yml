name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Compute build number
        shell: pwsh
        run: |
          $build = 121 + [int]$env:GITHUB_RUN_NUMBER
          "BUILD=$build" >> $env:GITHUB_ENV
          "APP_VERSION=1.0.$build" >> $env:GITHUB_ENV
          "TAG=v$build" >> $env:GITHUB_ENV

      - name: Bump versions
        shell: pwsh
        run: |
          npm pkg set version=$env:APP_VERSION
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^version = "[^"]+"', "version = `"$env:APP_VERSION`""
          Set-Content src-tauri/Cargo.toml $cargo -NoNewline
          $config = Get-Content src-tauri/tauri.conf.json -Raw
          $config = $config -replace '"version": "[^"]+"', "`"version`": `"$env:APP_VERSION`""
          Set-Content src-tauri/tauri.conf.json $config -NoNewline
          npm install --package-lock-only

      - name: Check release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:TAG --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            throw "Release $env:TAG already exists. Trigger a new run for the next build."
          }
          exit 0

      - name: Build signed installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Prepare updater manifest
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $installer = "Valotrack_$env:APP_VERSION" + "_x64-setup.exe"
          $signature = (Get-Content "$dir/$installer.sig" -Raw).Trim()
          $notes = "Automated signed Valotrack build $env:BUILD."
          $latest = [ordered]@{
            version = $env:APP_VERSION
            notes = $notes
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$installer"
              }
            }
          }
          [IO.File]::WriteAllText(
            "$dir/latest.json",
            ($latest | ConvertTo-Json -Depth 6),
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $installer = "Valotrack_$env:APP_VERSION" + "_x64-setup.exe"
          $notes = "Automated signed Valotrack build $env:BUILD."
          gh release create $env:TAG `
            --title "Valotrack v$env:BUILD" `
            --notes $notes `
            --latest `
            "$dir/$installer" `
            "$dir/$installer.sig" `
            "$dir/latest.json"
